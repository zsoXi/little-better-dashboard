name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -m py_compile opencode_dashboard.py
      - name: Run skeleton tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify acceptance tool help
        run: python tools/verify_acceptance.py --help
